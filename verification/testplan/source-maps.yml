testplans:
  - name: 'Data over-/underflow handling'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_bus_stall.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_bus_stall(_[0-9]+)?.xml"
  - name: 'Recovery bypass'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_bypass.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_(bypass|i3c_target)(_[0-9]+)?.xml"
  - name: 'CCC handling'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_ccc.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_ccc(_[0-9]+)?.xml"
  - name: 'Controller CCC generation'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/i3c_axi_controller/test_controller_ccc.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller/test_controller_ccc(_[0-9]+)?.xml"
  - name: 'Controller IBI Handling'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/i3c_axi_controller/test_controller_ibi.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller/test_controller_ibi(_[0-9]+)?.xml"
  - name: 'Controller Generate HDR Exit Pattern'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/i3c_axi_controller/test_controller_hdr_exit.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller/test_controller_hdr_exit(_[0-9]+)?.xml"
  - name: 'Controller error generation'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/i3c_axi_controller_err/test_controller_error.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller_err/test_controller_error(_[0-9]+)?.xml"
  - name: '(Controller-specific)? ?CSR access check'
    testpoints:
    - name: "^(.*)$"
      tests:
      - name: ".*csr_access.*"
        source: ".*verification/cocotb/top/lib_i3c_top/test_csr_access.py"
        cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_csr_access(_[0-9]+)?.xml"
      - name: ".*(configure|stdby).*"
        source: ".*verification/cocotb/top/i3c_axi_controller/test_configure_i3c_cores.py"
        cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller/test_configure_i3c_cores(_[0-9]+)?.xml"
  - name: 'Enter and exit HDR mode'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_enter_exit_hdr_mode.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_enter_exit_hdr_mode(_[0-9]+)?.xml"
  - name: 'Target interrupts'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_interrupts.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_(interrupts|i3c_target)(_[0-9]+)?.xml"
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_interrupt_toggles.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_interrupt_togggles(_[0-9]+)?.xml"
  - name: 'Target error detection'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_te_errors.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_(te_errors|recovery|i3c_target)(_[0-9]+)?.xml"
  - name: 'Target'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_i3c_target.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_i3c_target(_[0-9]+)?.xml"
  - name: 'Recovery mode tests'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_recovery.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_recovery(_[0-9]+)?.xml"
  - name: 'target_peripheral_reset'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_target_reset.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_target_reset(_[0-9]+)?.xml"
  - name: 'IBI handling'
    testpoints:
    - name: "^(.*)$"
      tests:
      - name: "^.*multi_queue.*$"
        source: ".*verification/cocotb/top/lib_i3c_top/test_ibi_multi_queue.py"
        cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_ibi_multi_queue(_[0-9]+)?.xml"
      - name: "^(.*)$"
        source: ".*verification/cocotb/top/lib_i3c_top/test_ibi.py"
        cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_ibi(_[0-9]+)?.xml"
  - name: 'Empty queue read handling'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_empty_queue_read.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_empty_queue_read(_[0-9]+)?.xml"
  - name: 'tSCO timing verification'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/lib_i3c_top/test_tsco_violation.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_tsco_violation(_[0-9]+)?.xml"
  - name: 'pec'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/block/recovery_pec/test_pec.py"
      cocotb_xml: ".*verification/cocotb/block/recovery_pec/test_pec(_[0-9]+)?.xml"
  - name: 'width_converter_[N8]to[N8]'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/block/{{testplan_file.stem}}/test_converter.py"
  - name: 'Controller Private Write'
    testpoints:
    - name: "^(.*)$"
      tests:
      - name: ".*write_repeated_start.*"
        source: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller_repeated_start.py"
        cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller_repeated_start(_[0-9]+)?.xml"
      - name: "^(.*)$"
        source: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller_write_target_read.py"
        cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller_write_target_read(_[0-9]+)?.xml"
  - name: 'Controller Private Read'
    testpoints:
    - name: "^(.*)$"
      tests:
      - name: ".*read_repeated_start.*"
        source: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller_repeated_start.py"
        cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller_repeated_start(_[0-9]+)?.xml"
      - name: "^(.*)$"
        source: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller_read_target_write.py"
        cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller_read_target_write(_[0-9]+)?.xml"
  - name: 'Controller I2C Transaction'
    testpoints:
    - name: "^(.*)$"
      tests:
      - name: "^(.*)$"
        source: ".*verification/cocotb/top/i2c_axi_controller/test_i2c_controller.py"
        cocotb_xml: ".*verification/cocotb/top/i2c_axi_controller/test_i2c_controller(_[0-9]+)?.xml"
  - name: 'Controller I3C flow'
    testpoints:
    - name: "^(.*)$"
      source: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller.py"
      cocotb_xml: ".*verification/cocotb/top/i3c_axi_controller/test_i3c_controller(_[0-9]+)?.xml"
  - name: '^(controller|target)_axi_filtering$'
    testpoints:
    - name: "^(.*)$"
      tests:
      - name: "^.*(hci|pio|csr|device_addr).*$"
        source: ".*verification/cocotb/block/axi_adapter_id_filter/test_seq_csr_access.py"
        cocotb_xml: ".*verification/cocotb/block/axi_adapter_id_filter/test_seq_csr_access(_[0-9]+)?.xml"
      - name: "^.*(swap|toggle).*$"
        source: ".*verification/cocotb/block/axi_adapter_id_filter/test_runtime_id_change.py"
        cocotb_xml: ".*verification/cocotb/block/axi_adapter_id_filter/test_runtime_id_change(_[0-9]+)?.xml"
      - name: "^(.*)$"
        source: ".*verification/cocotb/block/axi_adapter_id_filter/test_bus_stress.py"
        cocotb_xml: ".*verification/cocotb/block/axi_adapter_id_filter/test_bus_stress(_[0-9]+)?.xml"
  - name: 'tti_queues'
    testpoints:
    - name: "^(.*)$"
      tests:
      - name: "^.*_capacity_status$"
        source: ".*verification/cocotb/block/lib_hci_queues/test_empty.py"
        cocotb_xml: ".*verification/cocotb/block/hci_queues_axi/test_empty(_[0-9]+)?.xml"
      - name: "^.*_(setup_threshold|should_raise_thld_trig)$"
        source: ".*verification/cocotb/block/lib_hci_queues/test_threshold.py"
        cocotb_xml: ".*verification/cocotb/block/hci_queues_axi/test_threshold(_[0-9]+)?.xml"
  - name: 'hci_queues'
    testpoints:
    - name: "^(.*)$"
      tests:
      - name: "^clear_on_nonempty_.*_queue$"
        source: ".*verification/cocotb/block/lib_hci_queues/test_clear.py"
        cocotb_xml: ".*verification/cocotb/block/hci_queues_axi/test_clear(_[0-9]+)?.xml"
      - name: "^.*_capacity_status$"
        source: ".*verification/cocotb/block/lib_hci_queues/test_empty.py"
        cocotb_xml: ".*verification/cocotb/block/hci_queues_axi/test_empty(_[0-9]+)?.xml"
      - name: "^.*_(setup_threshold|should_raise_thld_trig)$"
        source: ".*verification/cocotb/block/lib_hci_queues/test_threshold.py"
        cocotb_xml: ".*verification/cocotb/block/hci_queues_axi/test_threshold(_[0-9]+)?.xml"
  - name: "flow_active"
    source: ".*verification/cocotb/block/flow_active/test_flow_active_immediate_write.py"
    cocotb_xml: ".*verification/cocotb/block/flow_active/test_flow_active_immediate_write(_[0-9]+)?.xml"
  - name: "^(bus_monitor)$"
    source: ".*verification/cocotb/block/ctrl_bus_monitor/test_bus_monitor.py"
    cocotb_xml: ".*verification/cocotb/block/ctrl_bus_monitor/test_bus_monitor(_[0-9]+)?.xml"
  - name: "^(i3c_bus_monitor)$"
    source: ".*verification/cocotb/block/.*/test_i3c_bus_monitor.py"
    cocotb_xml: ".*verification/cocotb/block/.*/test_i3c_bus_monitor(_[0-9]+)?.xml"

  # Catch-alls
  - name: 'Bus timers top-level'
    source: ".*verification/cocotb/top/lib_i3c_top/test_bus_timers.py"
    cocotb_xml: ".*verification/cocotb/top/i3c_axi/test_bus_timers(_[0-9]+)?.xml"
  - name: "^csr_sw_access$"
    source: ".*verification/cocotb/block/lib_adapter/test_{{testplan_file.stem}}.py"
    cocotb_xml: ".*verification/cocotb/block/axi_adapter/test_{{testplan_file.stem}}(_[0-9]+)?.xml"
  - name: "^(bus_.x.*|ccc)$"
    source: ".*verification/cocotb/block/{{testplan_file.stem}}/test_{{testplan_file.stem}}.py"
    cocotb_xml: ".*verification/cocotb/block/{{testplan_file.stem}}/test_{{testplan_file.stem}}(_[0-9]+)?.xml"
  - name: "^(bus_.*)$"
    source: ".*verification/cocotb/block/ctrl_{{testplan_file.stem}}/test_{{testplan_file.stem}}.py"
    cocotb_xml: ".*verification/cocotb/block/ctrl_{{testplan_file.stem}}/test_{{testplan_file.stem}}(_[0-9]+)?.xml"
# Master catch-all: Scan all block and top-level AXI files for test coverage
  - name: '^(.*)$'
    source: '.*verification/cocotb/(block|top/lib_i3c_top)/.*\.py$'
    cocotb_xml: '.*verification/cocotb/(block|top/i3c_axi)/.*\.xml$'
