  axi_adapter:
    source_path: src/hci/axi_adapter.sv
    source_sha: df73e1d7a5642d8e65bb01cd05a47ad6a15c6f65979975efd9a5a9670a8b621e
    all:
      CSR addresses are aligned to 4 bytes:
        toggle:
        - araddr_i: [0-1]
        - awaddr_i: [0-1]
        - s_cpuif_addr: [0-1]
        - i3c_req_addr: [0-1]
        - i3c_req_size: [2]

      BUSER is unimplemented (tied to 0):
        toggle:
        - buser_o

      RUSER is unimplemented (tied to 0):
        toggle:
        - ruser_o

      Data width is only 32-bit:
        toggle:
        - arsize_i: [2]
        - awsize_i: [2]

      Neither EXOKAY nor DECERR are issued:
        toggle:
        - rresp_o: [0]
        - bresp_o: [0]

      AXI WRAP bursts are not used:
        toggle:
          - arburst_i: [1]
          - awburst_i: [1]

      RDL code doesn't generate access errors:
        toggle:
        - s_cpuif_rd_err
        - s_cpuif_wr_err

      Extended hold can't be asserted alone since it would require AXI ID become illegal during transaction:
        cond:
          - 10: [3 "010"]  # rd_hld = (rd_req_legal | rd_hld_ext | s_cpuif_req_stall_rd) & cpuif_no_ack;
          - 12: [3 "010"]  # wr_hld = (wr_req_legal | wr_hld_ext | s_cpuif_req_stall_wr) & cpuif_no_ack;
          - 14: [2 "01"]  # i3c_rd_err = ((rd_req & !rlegal) | s_cpuif_rd_err) & !wr_hld;
          - 17: [2 "01"]  # i3c_wr_err = ((wr_req & !wlegal) | s_cpuif_wr_err) & !rd_hld;

      Unreachable due to common contradictory signal dependencies:
        cond:
          - 16: [2 "10"]  # i3c_wr_err = ((wr_req & !wlegal) | s_cpuif_wr_err) & !rd_hld;

      Unused:
        toggle:
          - cpuif_req_stall


