      Sink ready is assigned as `bcnt != s_bytes` so these can never be different:
        cond:
          - 3: [1 "011", 3 "110"]  # if ((bcnt != s_bytes) & sink_valid_i & sink_ready_o) bcnt <= bcnt + 1;
          - 7: [1 "011", 3 "110"]  # if ((bcnt != s_bytes) & sink_valid_i & sink_ready_o) sreg[(BytesW)'(bcnt)*8+:8] <= sink_data_i;

      Source valid is assigned as `bcnt == s_bytes` so these can never be different:
        cond:
          - 5: [1 "011", 2 "101"]  # if ((bcnt == s_bytes) & source_valid_o & source_ready_i) bcnt <= '0;
          - 9: [1 "011", 2 "101"]  # if ((bcnt == s_bytes) & source_valid_o & source_ready_i) sreg <= '0;


  width_converter_Nto8:
    source_path: src/ctrl/width_converter_Nto8.sv
    all:
      Sink ready is assigned as `bcnt == '0` so these can never be different:
        cond:
          - 3: [1 "0111", 3 "1101"]  # if ((bcnt == '0) & sink_valid_i & sink_ready_o & ~source_flush_i) bcnt <= Bytes;
          - 7: [1 "011", 3 "110"]  # if ((bcnt == '0) & sink_valid_i & sink_ready_o) sreg <= sink_data_i;

