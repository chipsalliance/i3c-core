          - 13: [1 "01"]  # rp_resp  = txn_allow && (txn_err || err) ? AXI_RESP_SLVERR : txn_allow && txn_ctx.lock ? AXI_RESP_EXOKAY : AXI_RESP_OKAY;
        branch:
