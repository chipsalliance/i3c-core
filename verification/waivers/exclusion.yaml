  descriptor_ibi:
    source_path: src/ctrl/descriptor_ibi.sv
    source_sha: a34ee167352bfcf2a48dbeda6e51b270c851f362b08260d483e4e7c2ba48c81a
    all:
      8-bit value divided by 4 => 2 upper bits unused:
        toggle:
        - data_words: [6-7]

      Not enough states in the FSM:
        toggle:
        - state_q: [3-7]

      IBI queue cannot be flushed in WriteMdb state:
        line:
          - 103  # if (data_words == 0) begin
          - 105  # state_d = Idle;
          - 108  # ibi_queue_rready_o = 1'b1;
          - 110  # state_d = (data_words == 8'd1) ? Idle : Flush;
        cond:
          - 2  # WriteMdb: if (data_words == 0)
          - 3  # WriteMdb: state_d = (data_words == 8'd1) ? Idle : Flush;
          - 4  # WriteMdb: state_d = (data_words == 8'd1) ? Idle : Flush;
        branch:
          - 0:  # case (state_q)
            - 5  # WriteMdb: state_d = Idle;
            - 6  # WriteMdb: state_d = (data_words == 8'd1) ? Idle : Flush;
            - 7  # WriteMdb: state_d = (data_words == 8'd1) ? Idle : Flush;

      IBI queue cannot fit more than 251 data bytes so data byte counter cannot reach 252:
        cond:
          - 8: [1 "0"]  # WriteData: if (data_cnt_q[7:2] != '1)
          - 12: [1 "0"]  # Flush: if (data_cnt_q[7:2] != '1)
        line:
          - 132  # WriteData: data_cnt_d = '0;
          - 133  # WriteData: state_d = Idle;
          - 157  # Flush: data_cnt_d = '0;
          - 158  # Flush: state_d = Idle;
        branch:
          - 0:  # case (state_q)
            - 12  # WriteData: data_cnt_d = '0;
            - 18  # Flush: data_cnt_d = '0;


