  descriptor_rx:
    source_path: src/ctrl/descriptor_rx.sv
    source_sha: 81d54dcf62ada6616a3503c87c189b209bb7141f5ae2e547abe440f55523b8d2
    all:
      Reserved upper 3 bits of the RX descriptor ERROR field:
        toggle:
        - tti_rx_desc_queue_wdata_o: [29-31]
        - rx_descriptor: [29-31]
        - rx_error: [1-3]

      Unused bits:
        toggle:
        - tti_rx_desc_queue_wdata_o: [16-27]
        - rx_descriptor: [16-27]

      Unreasonable RX data length:
        toggle:
        - tti_rx_desc_queue_wdata_o: [9-15]
        - rx_descriptor: [9-15]
        - byte_counter: [9-15]
        - byte_counter_q: [9-15]
      Ready drops only after writing 4 bytes or when FIFO is full. Valid cannot be high in none of those cases - in the first one we just consumed a received byte so valid drops, in the second one valid is gated with overflow_err signal in target_fsm:
        cond:
        - 1: [1 "01"] # else if (rx_byte_ready_o && rx_byte_valid_i) begin


  descriptor_tx:
    source_path: src/ctrl/descriptor_tx.sv
    source_sha: feaed76019a16fa86d253bd2fd5598652f7f76dd800a8c623b5f0ddb2a701926
    all:
      Unused upper bits:
        toggle:
        - tx_descriptor: [16-31]

      Unreasonable TX data length:
        toggle:
        - tx_descriptor: [9-15]
        - byte_counter: [9-15]
        - data_len: [9-15]
        - data_len_words: [7-31]

      tx_abort flush cannot be valid when tx_start_i is valid:
        cond:
        - 8: [4 "1110"] # assign tti_tx_desc_queue_rready_o = tti_tx_desc_queue_rvalid_i && !descriptor_valid && tx_start_i && !(flush || tx_abort_i)
      Abort would have to happen on the last transfered byte (so effectively abort would mean regular end of transfer):
        cond:
        - 2: [1 "01"] # if ((byte_counter != 16'h0) && tx_abort_i ) begin
      If byte_count is 1 or 0 during flushing, rvalid has to be 1:
        cond:
        - 4: [4 "100"] # if (((byte_counter inside {16'd1, 16'd0}) && tti_tx_queue_rvalid_i) || (!tti_tx_queue_rvalid_i && tti_tx_queue_empty_i) || (tx_queue_flush_o)) begin
      Overflow is catched by other logic:
        cond:
        - 11: [3 "110"] # assign tx_start = !tx_pending && descriptor_valid && (TtiTxDescDataWidth'(tti_tx_queue_depth_i + 1) >= data_len_words);

