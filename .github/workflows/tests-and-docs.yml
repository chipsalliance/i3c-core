name: Run Tests

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: "noninteractive"
  VERILATOR_VERSION: "v5.024"

jobs:
  # =============================================================================
  # Generate test matrix dynamically from noxfile.py
  # =============================================================================
  generate-matrix:
    name: Generate test matrix
    runs-on: ubuntu-latest
    outputs:
      ahb-matrix: ${{ steps.gen.outputs.ahb_matrix }}
      axi-matrix: ${{ steps.gen.outputs.axi_matrix }}
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Generate test matrices
        id: gen
        run: |
          python3 << 'EOF'
          import json
          import re
          import os

          with open('verification/cocotb/noxfile.py') as f:
              content = f.read()

          ahb_tests = []
          axi_tests = []

          # Pattern to match @nox.session with tags followed by def xxx_verify
          # Use .*? to allow @nox.parametrize decorators between @nox.session and def
          pattern = r'@nox\.session\(tags=\[([^\]]+)\]\).*?def (\w+_verify)\('
          
          for match in re.finditer(pattern, content, re.DOTALL):
              tags_str, func_name = match.groups()
              tags = [t.strip().strip('"\'') for t in tags_str.split(',')]
              
              # Skip if not a test session
              if 'tests' not in tags:
                  continue
              
              has_ahb = 'ahb' in tags
              has_axi = 'axi' in tags
              
              if has_ahb and not has_axi:
                  # AHB-only test
                  ahb_tests.append(func_name)
              elif has_axi and not has_ahb:
                  # AXI-only test
                  axi_tests.append(func_name)
              elif has_ahb and has_axi:
                  # Shared test - run with both configs
                  ahb_tests.append(func_name)
                  axi_tests.append(func_name)

          # Remove duplicates and sort
          ahb_tests = sorted(set(ahb_tests))
          axi_tests = sorted(set(axi_tests))

          print(f"Found {len(ahb_tests)} AHB tests: {ahb_tests}")
          print(f"Found {len(axi_tests)} AXI tests: {axi_tests}")

          # Write to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"ahb_matrix={json.dumps(ahb_tests)}\n")
              f.write(f"axi_matrix={json.dumps(axi_tests)}\n")
          EOF

  # =============================================================================
  # Run AHB tests in parallel
  # =============================================================================
  tests-ahb:
    name: "AHB: ${{ matrix.test }}"
    needs: [generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.generate-matrix.outputs.ahb-matrix) }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt -qqy update
          sudo apt -qqy --no-install-recommends install \
            help2man libfl-dev make g++ git bison flex gperf \
            libreadline-dev libbz2-dev autoconf

      - name: Setup repository
        uses: actions/checkout@v4

      - name: Get Submodules
        run: |
          git submodule update --init --recursive

      - name: Cache Verilator build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-install
          key: verilator-install-${{ env.VERILATOR_VERSION }}-${{ runner.os }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator -b ${{ env.VERILATOR_VERSION }}
          cd verilator
          autoconf
          ./configure --prefix=$HOME/verilator-install
          make -j$(nproc)
          make install

      - name: Setup environment
        run: |
          echo "$HOME/verilator-install/bin" >> $GITHUB_PATH
          echo "VERILATOR_ROOT=$HOME/verilator-install/share/verilator" >> $GITHUB_ENV
          echo "I3C_ROOT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CALIPTRA_ROOT=$GITHUB_WORKSPACE/third_party/caliptra-rtl" >> $GITHUB_ENV

      - name: Install Python environment
        run: |
          ./install.sh

      - name: Configure for AHB
        run: |
          source activate.sh
          make config CFG_NAME=ahb

      - name: Run test
        id: run-test
        run: |
          source activate.sh
          nox -f verification/cocotb/noxfile.py -s ${{ matrix.test }} --no-venv -v

      - name: Show test logs on failure
        if: failure() && steps.run-test.outcome == 'failure'
        run: |
          echo "=== Test failed, showing log files ==="
          for log in $(find verification/cocotb -name "*.log" -type f 2>/dev/null); do
            echo ""
            echo "========================================"
            echo "=== $log ==="
            echo "========================================"
            cat "$log"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ahb-${{ matrix.test }}
          path: |
            verification/cocotb/**/results*.xml
            verification/cocotb/**/*.log

  # =============================================================================
  # Run AXI tests in parallel
  # =============================================================================
  tests-axi:
    name: "AXI: ${{ matrix.test }}"
    needs: [generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.generate-matrix.outputs.axi-matrix) }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt -qqy update
          sudo apt -qqy --no-install-recommends install \
            help2man libfl-dev make g++ git bison flex gperf \
            libreadline-dev libbz2-dev autoconf

      - name: Setup repository
        uses: actions/checkout@v4

      - name: Get Submodules
        run: |
          git submodule update --init --recursive

      - name: Cache Verilator build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-install
          key: verilator-install-${{ env.VERILATOR_VERSION }}-${{ runner.os }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator -b ${{ env.VERILATOR_VERSION }}
          cd verilator
          autoconf
          ./configure --prefix=$HOME/verilator-install
          make -j$(nproc)
          make install

      - name: Setup environment
        run: |
          echo "$HOME/verilator-install/bin" >> $GITHUB_PATH
          echo "VERILATOR_ROOT=$HOME/verilator-install/share/verilator" >> $GITHUB_ENV
          echo "I3C_ROOT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CALIPTRA_ROOT=$GITHUB_WORKSPACE/third_party/caliptra-rtl" >> $GITHUB_ENV

      - name: Install Python environment
        run: |
          ./install.sh

      - name: Configure for AXI
        run: |
          source activate.sh
          make config CFG_NAME=axi

      - name: Run test
        id: run-test
        run: |
          source activate.sh
          nox -f verification/cocotb/noxfile.py -s ${{ matrix.test }} --no-venv -v

      - name: Show test logs on failure
        if: failure() && steps.run-test.outcome == 'failure'
        run: |
          echo "=== Test failed, showing log files ==="
          for log in $(find verification/cocotb -name "*.log" -type f 2>/dev/null); do
            echo ""
            echo "========================================"
            echo "=== $log ==="
            echo "========================================"
            cat "$log"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-axi-${{ matrix.test }}
          path: |
            verification/cocotb/**/results*.xml
            verification/cocotb/**/*.log

  # =============================================================================
  # Aggregate test results
  # =============================================================================
  test-results:
    name: Aggregate test results
    needs: [tests-ahb, tests-axi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: tests-results
          path: test-results

      - name: Check test status
        run: |
          if [ "${{ needs.tests-ahb.result }}" != "success" ] || [ "${{ needs.tests-axi.result }}" != "success" ]; then
            echo "Some tests failed!"
            echo "AHB tests: ${{ needs.tests-ahb.result }}"
            echo "AXI tests: ${{ needs.tests-axi.result }}"
            exit 1
          fi
          echo "All tests passed!"

  # =============================================================================
  # Build documentation
  # =============================================================================
  docs-build:
    name: Documentation build
    runs-on: ubuntu-latest
    needs: [test-results]
    if: always() && needs.test-results.result == 'success'
    steps:
      - name: Install dependencies
        run: |
          sudo apt -qqy update && sudo apt -qqy --no-install-recommends install \
            python3 python3-pip python3-venv git

      - name: Setup repository
        uses: actions/checkout@v4

      - name: Get Submodules
        run: |
          git submodule update --init --recursive

      - uses: actions/download-artifact@v4
        with:
          name: tests-results
          path: tests-results

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          export I3C_ROOT_DIR="`pwd`"
          pip3 install -r requirements.txt
          pip3 install -r doc/requirements.txt

      - name: Generate VP
        run: |
          source .venv/bin/activate
          cp -r tests-results/* verification/cocotb/
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME/" make verification-docs-with-sim

      - name: Build Docs
        run: |
          pushd doc
            pip3 install -r requirements.txt
            TZ=UTC make html
          popd
          ls -lah doc/build
          git clone https://github.com/antmicro/i3c-core-coverage-results || exit 0
          cp i3c-core-coverage-results/*html doc/build/html

      - name: Pack artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ./doc/build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./doc/build/html
